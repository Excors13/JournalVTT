<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/styles/codex.css"><style>body{background:#222;color:white}.directory-header{display:flex;flex-direction:column;width:280px}.wc-native{display:block}#notifications{position:fixed;top:0;left:300px;z-index:10000}#test-menu{position:fixed;top:150px;left:400px;z-index:10001;background:#555;display:flex;flex-direction:column}</style><aside id="journal"><header class="directory-header"><input aria-label="Search native journals"><div class="header-actions" style="display:none"><button>Create journal</button></div></header><section class="directory-list"></section></aside><input id="chat" aria-label="Chat"><div id="notifications"></div>
<script type="module">
const {setup}=await import('/tests/fixtures.mjs');const {ID}=await import('/scripts/model.js');const store=await import('/scripts/store.js');setup();
const query=new URLSearchParams(location.search),role=query.get('role')||'p';
const folder=await store.saveFolder('quests','Investigations'),record=await store.createRecord({name:'Find the masks',section:'quests',folderId:folder.id},'<p>Find the camp.</p>');await store.provisionDiaries();
const plain=await JournalEntry.create({name:'Ordinary journal',ownership:{default:2},pages:[]});
game.user=game.users.get(role);if(role!=='gm')game.journal.splice(0,game.journal.length,...game.journal.filter(d=>d.testUserPermission(game.user,'LIMITED')));
window.fixture={folderId:folder.id,recordId:record.id,plainId:plain.id};
const hooks=new Map();window.Hooks={once:(n,f)=>{const a=hooks.get(n)||[];a.push({f,once:true});hooks.set(n,a);},on:(n,f)=>{const a=hooks.get(n)||[];a.push({f});hooks.set(n,a);}};
window.callHook=async(n,...args)=>{const list=[...(hooks.get(n)||[])];hooks.set(n,(hooks.get(n)||[]).filter(x=>!x.once));for(const {f} of list)await f(...args);};
window.confirmDelete=true;window.errors=[];
window.ui={notifications:{error:(message)=>{errors.push(message);const el=document.createElement('p');el.className='error';el.textContent=message;document.querySelector('#notifications').append(el);},info:()=>{}},journal:{element:document.querySelector('#journal')}};
class App{
  constructor(options={}){this.options=options;this.position={left:0,top:0,width:900,height:700,...options.position};this.id=this.constructor.DEFAULT_OPTIONS?.id||'app';this.rendered=false;}
  async render(){if(this._renderHTML){const result=await this._renderHTML();this.element?.remove();this.element=document.createElement('div');this.element.id=this.id;this.element.append(result);document.body.append(this.element);}this.rendered=true;await this._onRender({},{});return this;}
  async _onRender(){} async close(){this.element?.remove();this.element=null;this.rendered=false;return this;}bringToFront(){}setPosition(p){Object.assign(this.position,p);}
  _createContextMenu(entries,selector){this.element.addEventListener('contextmenu',e=>{const target=e.target.closest(selector);if(!target)return;const available=entries().filter(x=>typeof x.visible==='function'?x.visible(target):x.visible!==false);if(!available.length)return;e.preventDefault();e.stopPropagation();document.querySelector('#test-menu')?.remove();const menu=document.createElement('div');menu.id='test-menu';menu.setAttribute('role','menu');for(const item of available){const b=document.createElement('button');b.textContent=item.label;b.addEventListener('click',async event=>{menu.remove();await item.onClick(event,target);});menu.append(b);}document.body.append(menu);});}
}
window.foundry={applications:{api:{ApplicationV2:App,DialogV2:{confirm:async()=>confirmDelete}},sidebar:{apps:{ControlsConfig:class extends App{constructor(o){super(o);window.keybindingOptions=o;}async render(o){window.keybindingRendered=o;return this;}}}},ux:{TextEditor:{implementation:{enrichHTML:async html=>html}}},apps:{DocumentOwnershipConfig:class extends App{constructor(o){super(o);window.ownershipDialog=o;}}}}};
window.CONST={KEYBINDING_PRECEDENCE:{PRIORITY:0}};
game.modules=new Map([[ID,{version:'1.1.1',active:true}]]);game.ready=false;
const rulesGet=game.settings.get,values=new Map();game.settings.settings=new Map();game.settings.menus=new Map();game.settings.register=(id,key,config)=>{game.settings.settings.set(`${id}.${key}`,config);values.set(`${id}.${key}`,config.default);};game.settings.registerMenu=(id,key,config)=>game.settings.menus.set(`${id}.${key}`,config);game.settings.get=(id,key)=>key==='policies'?rulesGet(id,key):values.get(`${id}.${key}`);game.settings.set=async(id,key,value)=>values.set(`${id}.${key}`,value);
const actions=new Map(),bindings=new Map();game.keybindings={register:(id,key,config)=>{actions.set(`${id}.${key}`,config);if(!bindings.has(`${id}.${key}`))bindings.set(`${id}.${key}`,structuredClone(config.editable));},get:(id,key)=>bindings.get(`${id}.${key}`),set:async(id,key,next)=>bindings.set(`${id}.${key}`,structuredClone(next))};
window.addEventListener('keydown',event=>{for(const [id,action] of actions){if(action.restricted&&!game.user.isGM)continue;for(const binding of bindings.get(id)||[]){const mods=binding.modifiers||[];if(binding.key!==event.code||event.ctrlKey!==mods.includes('CONTROL')||event.shiftKey!==mods.includes('SHIFT')||event.altKey!==mods.includes('ALT'))continue;if(action.onDown({event,repeat:event.repeat}))event.preventDefault();}}});
window.paintDirectory=async()=>{const list=document.querySelector('.directory-list');list.replaceChildren();for(const f of game.folders){const el=document.createElement('div');el.dataset.documentId=f.id;el.className='folder wc-native';el.textContent=f.name;list.append(el);}for(const d of game.journal){const el=document.createElement('div');el.dataset.entryId=d.id;el.className='directory-item wc-native';el.textContent=d.name;list.append(el);}await callHook('renderJournalDirectory',{collection:game.journal,id:'journal'},ui.journal.element);};
const preparedGame=game;
try{window.game=undefined;await import('/scripts/bootstrap.js');window.game=preparedGame;await callHook('init');game.ready=true;await callHook('ready');await paintDirectory();window.testReady=true;}catch(error){window.game=preparedGame;window.harnessError=String(error);}
</script>
