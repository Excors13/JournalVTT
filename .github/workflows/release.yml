name: Publish Foundry release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.2.0'
        required: true
        default: '0.2.0'
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: world-codex-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify JavaScript and run tests
        run: |
          for script in scripts/*.js; do node --check "$script"; done
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build module and manifest
        run: python3 tools/build_release.py --repo "$GH_REPO" --version "$RELEASE_VERSION" --out dist
      - name: Publish assets
        shell: bash
        run: |
          TAG="v${RELEASE_VERSION#v}"
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "World Codex $TAG" --notes "World journal, quests, interactive maps, labels and personal diaries for Foundry VTT 14."
          fi
          gh release upload "$TAG" dist/module.json dist/world-codex.zip --repo "$GH_REPO" --clobber
